version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: spotify-clone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotify
      POSTGRES_PASSWORD: spotify
      POSTGRES_DB: spotify_clone
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotify -d spotify_clone"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: spotify-clone-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://spotify:spotify@postgres:5432/spotify_clone?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_secret}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      PORT: 4000
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  pgdata:
